- aid: amp-bank:amp-bank-cdr-product-reference-data-api
  name: AMP Bank CDR Product Reference Data API
  tags:
  - CDR
  - Open Banking
  - Product Reference Data
  - Banking
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.amp.com.au/personal-banking/open-banking/open-banking-api
  baseURL: https://api.cdr-api.amp.com.au/cds-au/v1/banking/products
  properties:
  - url: https://www.amp.com.au/personal-banking/open-banking/open-banking-api
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-products
    type: APIReference
  - url: openapi/amp-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Public, unauthenticated Consumer Data Right Product Reference Data (PRD)
    API for the My AMP retail banking brand (BSB 939-200). Serves GET /banking/products
    and /banking/products/{productId} conforming to the DSB Consumer Data Standards.
    Confirmed live returning HTTP 200 (x-v 4) with eight AMP Bank products including
    home loans, savings and term deposits. Requires the CDS x-v version header; no
    authentication.
- aid: amp-bank:amp-bank-go-cdr-product-reference-data-api
  name: AMP Bank GO CDR Product Reference Data API
  tags:
  - CDR
  - Open Banking
  - Product Reference Data
  - Small Business
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.amp.com.au/personal-banking/open-banking/open-banking-api
  baseURL: https://pub.cdr-sme.amp.com.au/api/cds-au/v1/banking/products
  properties:
  - url: https://www.amp.com.au/personal-banking/open-banking/open-banking-api
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-products
    type: APIReference
  - url: openapi/amp-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Public, unauthenticated Consumer Data Right Product Reference Data (PRD)
    API for the AMP Bank GO digital small-business and everyday banking brand (BSB
    939-900). Confirmed live returning HTTP 200 (x-v 4 and 5) with nine AMP Bank GO
    products including business save, everyday and term deposit accounts, conforming
    to the DSB Consumer Data Standards. Requires the CDS x-v version header; no authentication.
- aid: amp-bank:amp-bank-cdr-accounts-balances-api
  name: AMP Bank CDR Accounts & Balances API
  tags:
  - CDR
  - Open Banking
  - Accounts
  - Balances
  - Banking
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.amp.com.au/personal-banking/open-banking/open-banking-api
  baseURL: https://api.cdr.amp.com.au/cds-au/v1/banking/accounts
  properties:
  - url: https://www.amp.com.au/personal-banking/open-banking/open-banking-api
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-accounts
    type: APIReference
  - url: openapi/amp-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right banking-account surface implementing
    the DSB Consumer Data Standards Get Accounts, Get Bulk Balances, Get Account Balance
    and Get Account Detail endpoints (/banking/accounts, /banking/accounts/balances,
    /banking/accounts/{accountId}/balance, /banking/accounts/{accountId}). These endpoints
    are NOT public — they are reached over the AMP Bank data-holder host api.cdr.amp.com.au
    (confirmed via 301 redirect from the public host) and require FAPI 1.0 Advanced
    security, mutual TLS and a consumer authorization obtained through an accredited
    Accredited Data Recipient (ADR) under the CDR regime. Standardized DSB shape, not
    a bank-proprietary API.
- aid: amp-bank:amp-bank-cdr-transactions-api
  name: AMP Bank CDR Transactions API
  tags:
  - CDR
  - Open Banking
  - Transactions
  - Banking
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.amp.com.au/personal-banking/open-banking/open-banking-api
  baseURL: https://api.cdr.amp.com.au/cds-au/v1/banking/accounts
  properties:
  - url: https://www.amp.com.au/personal-banking/open-banking/open-banking-api
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-transactions-for-account
    type: APIReference
  - url: openapi/amp-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right transactions surface implementing
    the DSB Consumer Data Standards Get Transactions For Account and Get Transaction
    Detail endpoints (/banking/accounts/{accountId}/transactions and /banking/accounts/{accountId}/transactions/{transactionId}).
    Reached over the AMP Bank data-holder host api.cdr.amp.com.au and gated by FAPI
    1.0 Advanced, mutual TLS and a consumer authorization brokered by an accredited
    Accredited Data Recipient (ADR); it is not publicly callable. Standardized DSB
    shape shared across all Australian ADIs, not a bank-proprietary API.

    type: OpenAPI
  description: Consumer-authorized Consumer Data Right payments-arrangement surface
    implementing the DSB Consumer Data Standards Get Direct Debits For Account, Get
    Bulk Direct Debits, Get Scheduled Payments For Account and Get Bulk Scheduled Payments
    endpoints (/banking/accounts/{accountId}/direct-debits, /banking/accounts/direct-debits,
    /banking/accounts/{accountId}/payments/scheduled, /banking/payments/scheduled).
    Reached over the AMP Bank data-holder host api.cdr.amp.com.au and gated by FAPI
    1.0 Advanced, mutual TLS and a consumer authorization brokered by an accredited
    Accredited Data Recipient (ADR). Standardized DSB shape, not bank-proprietary.
- aid: amp-bank:amp-bank-cdr-payees-api
  name: AMP Bank CDR Payees API
  tags:
  - CDR
  - Open Banking
  - Payees
  - Banking
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.amp.com.au/personal-banking/open-banking/open-banking-api
  baseURL: https://api.cdr.amp.com.au/cds-au/v1/banking/payees

  cross_link: errors/amp-bank-problem-types.yml
rate_limit_signaling:
  documented: true
  status_on_exhaustion: 429
  headers:
  - Retry-After
  note: >-
    The DSB Consumer Data Standards state "Throttling is a NFR. The data holder
    should include a Retry-After header in the response" for 429 Too Many
    Requests. A live unauthenticated GET /banking/products (x-v 4, probed
    2026-10-20) returned no X-RateLimit-* / RateLimit-* headers.
  cross_link: rate-limits/amp-bank-rate-limits.yml
request_id:
  header: x-fapi-interaction-id

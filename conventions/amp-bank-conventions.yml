    Every operation in the captured CDR banking contracts is a GET (read-only
    data sharing / product reference data). There is no write surface, so
    reversal, dry-run and idempotency are not applicable.
data_conventions:
  dates: ISO 8601 DateTimeString / DateString (x-cds-type extensions)
  amounts: AmountString (string-encoded decimal)

name: AMP Bank
kind: company
description: AMP Bank Limited is the retail and business banking arm of AMP Limited
  (ASX:AMP), a diversified Australian financial services group operating since 1849
  and headquartered in Sydney. AMP Bank is a publicly listed (shareholder-owned, not
  a mutual) authorised deposit-taking institution (ADI) regulated by APRA, offering
  home loans, deposit and savings accounts, and the digital AMP Bank GO small-business
  and everyday banking brand. As an active ADI, AMP participates in Australia's Consumer
  Data Right (CDR / Open Banking) regime and exposes public, unauthenticated Product
  Reference Data (PRD) APIs conforming to the DSB Consumer Data Standards, alongside
  the accredited, FAPI-secured consumer data sharing surface used by authorised data
  recipients.

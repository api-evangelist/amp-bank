  - url: https://www.amp.com.au/personal-banking/open-banking/open-banking-api
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-payees
    type: APIReference
  - url: openapi/amp-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right payees surface implementing the
    DSB Consumer Data Standards Get Payees and Get Payee Detail endpoints (/banking/payees
    and /banking/payees/{payeeId}), exposing a customer's saved payee list where the
    customer has authorized sharing. Reached over the AMP Bank data-holder host api.cdr.amp.com.au
    and gated by FAPI 1.0 Advanced, mutual TLS and a consumer authorization brokered
    by an accredited Accredited Data Recipient (ADR); not publicly callable. Standardized
    DSB shape shared across all Australian ADIs, not a bank-proprietary API.
